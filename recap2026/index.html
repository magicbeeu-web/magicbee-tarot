<link rel="preload" href="fonts/recap-serif.woff2" as="font" type="font/woff2" crossorigin>

<script>/* GoatCounter：?test=1 或 ?reset=1（自己測試）不計數（和抽牌首頁同一個帳號 magicbee） */
(function(){var q=location.search;window.__mbeeNoCount=/[?&](test|reset)=1(&|$)/.test(q);if(window.__mbeeNoCount)window.goatcounter={no_onload:true,no_events:true};})();</script>
<script data-goatcounter="https://magicbee.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div id="app">
 <div class="sky" id="sky" aria-hidden="true"></div>

 <!-- 1 開場 -->
 <section class="screen on" id="intro">
  <div class="intro-in">
   <img class="logo" src="../bee.webp" alt=""><img class="wm" src="../wordmark.webp" alt="Magic Bee">
   <p class="eyebrow">MAGIC BEE 2026 塔羅年度回顧</p>
   <h1 class="h1 gold">你的 2026 主牌<br>是哪一張？</h1>
   <div class="fan" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
   <p class="lead">回答 8 題，翻開陪你走過這一年的那張牌</p>
   <button class="btn" id="btnStart" type="button">開始測驗</button>
  </div>
 </section>

 <!-- 2 題目 -->
 <section class="screen" id="quiz">
  <div class="quiz-in">
   <div class="prog" aria-hidden="true"><div class="bar" id="bar"></div></div>
   <div class="qno" id="qno">Q1 / 8</div>
   <h2 class="qtext" id="qtext"></h2>
   <div class="opts" id="opts" role="list"></div>
   <button class="back" id="btnBack" type="button">‹ 上一題</button>
  </div>
 </section>

 <!-- 3 翻牌 -->
 <section class="screen" id="reveal">
  <div class="reveal-in"><div class="rv-card" id="rvCard"><div class="rv-b"></div><div class="rv-f" id="rvFace"></div></div>
   <p class="rv-t">正在翻開你的 2026 主牌</p></div>
 </section>

 <!-- 4 結果 -->
 <section class="screen" id="result">
  <div class="res-in" id="resIn">
   <div class="res-card" id="resCard">
    <p class="eyebrow gold">MAGIC BEE 2026 塔羅年度回顧</p>
    <div class="divider"></div>
    <img class="r-img" id="rImg" alt="">
    <h2 class="r-title"><span class="pre">你的 2026 主牌：</span><span class="gold" id="rName"></span></h2>
    <p class="r-tag" id="rTag"></p>
    <div class="stats">
     <div class="stat"><div class="s1">你的年度能量</div><div class="s2 gold" id="sEl"></div><div class="s3" id="sElD"></div></div>
     <div class="stat"><div class="s1">你選了它幾次</div><div class="s2 gold" id="sCnt"></div><div class="s3" id="sCntD"></div></div>
     <div class="stat"><div class="s1">你的年度關鍵字</div><div class="s2 gold" id="sKw"></div><div class="s3" id="sKwD"></div></div>
    </div>
    <p class="r-text" id="rText"></p>
    <div class="spell"><div class="sp1">你的 2027 開運咒語</div><div class="sp2 gold" id="rSpell"></div></div>
   </div>
   <div class="actions">
    <button class="btn" id="btnShare" type="button">分享我的主牌</button>
    <button class="btn ghost" id="btnAgain" type="button">再測一次</button>
   </div>
   <a class="line" id="lineLink" href="https://line.me/R/ti/p/@041giocs" target="_blank" rel="noopener">
    <img src="../bee.webp" alt="">
    <span>LINE 搜尋 @041giocs 每週免費抽牌一次</span>
   </a>
  </div>
 </section>

 <!-- 分享圖（不支援 Web Share 時） -->
 <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="儲存主牌圖">
  <div class="sheet-in">
   <img id="sheetImg" alt="我的 2026 主牌">
   <p class="sheet-t">長按圖片就能儲存或分享</p>
   <a class="btn" id="btnDl" download="magicbee-2026.png">下載圖片</a>
   <button class="btn ghost" id="btnClose" type="button">關閉</button>
  </div>
 </div>

 <button class="bgm-btn" id="bgmBtn" type="button" aria-label="關閉背景音樂" aria-pressed="true"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6.6" cy="17.6" r="2.6" fill="currentColor"/><circle cx="16.6" cy="15.4" r="2.6" fill="currentColor"/><path class="sl" d="M3.5 3.5l17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
 <div class="toast" id="toast"></div>
 <div class="testtag" id="testtag">測試模式</div>
</div>
